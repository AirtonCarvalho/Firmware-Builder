name: Compilar Firmware (.hex e .bin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar sketch
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar placas Arduino AVR e ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32

      - name: Compilar para Arduino Uno/Nano (.hex)
        run: |
          arduino-cli compile --fqbn arduino:avr:uno --output-dir build/arduino sketch/sketch.ino

      - name: Compilar para ESP32 (.bin)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build/esp32 sketch/sketch.ino

      - name: Disponibilizar arquivos .hex e .bin
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-Compilado
          path: build/
