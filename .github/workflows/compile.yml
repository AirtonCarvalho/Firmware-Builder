name: Compilar Firmware (.hex e .bin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar sketch
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar bibliotecas OLED (SSD1306 e GFX)
        run: |
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Instalar core ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compilar ESP32 Full Merged (.bin para 0x0)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir build/esp32 \
            sketch/sketch.ino

      - name: Remover preenchimento vazio (0xFF) do final do merged.bin
        run: |
          python3 -c '
          data = open("build/esp32/sketch.ino.merged.bin", "rb").read()
          trimmed = data.rstrip(b"\xff")
          # Alinha para múltiplo de 4096 bytes (setor da Flash)
          pad = (4096 - (len(trimmed) % 4096)) % 4096
          open("build/esp32/sketch.ino.merged.bin", "wb").write(trimmed + b"\xff" * pad)
          print(f"Tamanho otimizado: {len(trimmed) + pad} bytes")
          '

      - name: Disponibilizar .bin completo para download
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-ESP32-OLED
          path: build/esp32/sketch.ino.merged.bin
