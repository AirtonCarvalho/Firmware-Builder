name: Compilar Firmware (.hex e .bin)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar sketch
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Instalar bibliotecas OLED (SSD1306 e GFX)
        run: |
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"

      - name: Instalar core ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compilar para ESP32 OLED (.bin)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build/esp32 sketch/sketch.ino

      - name: Disponibilizar .bin para download
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-ESP32-OLED
          path: build/esp32/
